[package]
description = "One window for all your Minecraft instances"
license = "AGPL-3.0-only"
repository = "https://github.com/schrumbo/manycraft"
name = "manycraft"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
ignored = ["md-5"]

[dependencies]
anyhow = "1"
async-channel = "2.5.0"
dirs = "6"
gpui-kit = "0.8.1"
hickory-resolver = "0.26"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
md-5 = "0.10"
raw-window-handle = "0.6"
rayon = "1"
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sys-locale = "0.3.2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "3", features = ["json", "socks-proxy"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[target."cfg(windows)".dependencies]
junction = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
