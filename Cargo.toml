[package]
description = "One window for all your Minecraft instances"
license = "AGPL-3.0-only"
repository = "https://github.com/schrumbo/manycraft"
name = "manycraft"
version = "0.8.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
freya-proto = ["dep:freya", "dep:freya-winit", "dep:notify"]
freya = ["dep:freya", "dep:freya-winit", "dep:freya-core", "dep:open", "dep:rfd"]

[[bin]]
name = "manycraft"
path = "src/main.rs"

[[bin]]
name = "freya_proto"
path = "src/bin/freya_proto/main.rs"
required-features = ["freya-proto"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2.5.0"
base64 = "0.22"
dirs = "6"
freya = { version = "0.5.2", optional = true, features = ["engine"] }
freya-winit = { version = "0.5.2", optional = true }
freya-core = { version = "0.5.2", optional = true }
notify = { version = "8.2", optional = true }
open = { version = "5.4", optional = true }
flate2 = "1"
gpui-kit = "0.8.1"
hickory-resolver = "0.26"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
rayon = "1"
rfd = { version = "0.17", optional = true }
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sys-locale = "0.3.2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3", features = ["json", "socks-proxy"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
minisign-verify = "0.3"
sha2 = "0.10"
url = "2"

[package.metadata.deb]
name = "manycraft"
maintainer = "Schrumbo"
copyright = "Schrumbo"
license-file = ["LICENSE", "0"]
extended-description = "One window for all your Minecraft instances."
section = "games"
assets = [
    ["target/release/manycraft", "usr/bin/", "755"],
    ["packaging/linux/manycraft.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/manycraft.png", "usr/share/icons/hicolor/512x512/apps/manycraft.png", "644"],
]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
junction = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[patch.crates-io]
gpui-pre = { path = "patches/gpui-pre" }
gpui-pre-windows = { path = "patches/gpui-pre-windows" }
freya-core = { path = "patches/freya-core" }
freya-winit = { path = "patches/freya-winit" }
