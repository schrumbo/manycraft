plugins {
	id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/loader.gradle')

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation "io.netty:netty-codec-socks:${netty_version}"
	implementation "io.netty:netty-handler-proxy:${netty_version}"
	include("io.netty:netty-codec-socks:${netty_version}") { transitive = false }
	include("io.netty:netty-handler-proxy:${netty_version}") { transitive = false }
}
