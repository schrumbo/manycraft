plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
	id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
	id 'net.minecraftforge.jarjar' version "${forge_jarjar_version}" apply false
}

subprojects {
	apply plugin: 'java'

	repositories {
		mavenCentral()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
}
