pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'manycraft-companion'
include 'common', 'fabric'
if (!providers.gradleProperty('fabricOnly').isPresent()) {
	include 'neoforge', 'forge'
}
