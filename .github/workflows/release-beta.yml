name: Release beta

on:
  push:
    tags: ['v*-beta.*']

concurrency:
  group: release-beta
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag and draft the pre-release
        id: version
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          SHA=$(git rev-parse HEAD)
          TAG="$GITHUB_REF_NAME"
          case "$VERSION" in
            *-beta.*) ;;
            *) echo "::error::Cargo.toml says $VERSION, which is not a beta version."; exit 1 ;;
          esac
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match Cargo.toml ($VERSION). Delete the tag, fix the version and tag again."
            exit 1
          fi
          NOTES="packaging/release/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$DRAFT" = "false" ]; then
            echo "$TAG is already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The repository secret MINISIGN_SECRET_KEY is missing. Without it no release file can be signed and the app's updater would refuse every download."
            exit 1
          fi
          CORE=${VERSION%%-*}
          NUMBER=${VERSION##*.}
          TITLE="Manycraft $CORE Beta $NUMBER (Freya)"
          if [ "$DRAFT" = "missing" ]; then
            gh release create "$TAG" --draft --prerelease --latest=false --verify-tag --title "$TITLE" --notes-file "$NOTES"
          else
            gh release edit "$TAG" --prerelease --latest=false --title "$TITLE" --notes-file "$NOTES"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  agent:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: agent/build/libs/manycraft-agent.jar
          if-no-files-found: error

  test:
    needs: [prepare, agent]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: beta-test
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - name: Use the prebuilt companion agent
        shell: bash
        run: echo "MANYCRAFT_AGENT_JAR=$RUNNER_TEMP/agent/manycraft-agent.jar" >> "$GITHUB_ENV"
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libasound2-dev pkg-config
      - run: cargo test --locked

  macos:
    needs: [prepare, agent]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - name: Use the prebuilt companion agent
        shell: bash
        run: echo "MANYCRAFT_AGENT_JAR=$RUNNER_TEMP/agent/manycraft-agent.jar" >> "$GITHUB_ENV"
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/manycraft target/aarch64-apple-darwin/release/manycraft target/x86_64-apple-darwin/release/manycraft
      - name: Bundle and DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          APP="dist/Manycraft.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/manycraft "$APP/Contents/MacOS/"
          cp packaging/icons/manycraft.icns "$APP/Contents/Resources/"
          cp -R packaging/macos/en.lproj "$APP/Contents/Resources/"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          bash packaging/macos/sign.sh "$APP"
          ln -s /Applications dist/Applications
          DMG="Manycraft-$VERSION-macos-universal.dmg"
          SIZE=$(( $(du -sm dist | cut -f1) * 2 + 64 ))m
          hdiutil create -volname Manycraft -srcfolder dist -ov -fs HFS+ -size "$SIZE" -format UDZO "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
      - name: Upload
        run: gh release upload "v$VERSION" Manycraft-*.dmg* --clobber

  windows:
    needs: [prepare, agent]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - name: Use the prebuilt companion agent
        shell: bash
        run: echo "MANYCRAFT_AGENT_JAR=$RUNNER_TEMP/agent/manycraft-agent.jar" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - name: Install NSIS
        shell: bash
        run: command -v makensis || choco install nsis -y --no-progress
      - name: Installer
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          cd packaging/windows
          makensis -DVERSION="$VERSION" installer.nsi
          mv Manycraft-Setup-*.exe ../../
          cd ../..
          SETUP="Manycraft-Setup-$VERSION-windows-x64.exe"
          test -f "$SETUP"
          sha256sum "$SETUP" > "$SETUP.sha256"
      - name: Upload
        shell: bash
        run: gh release upload "v$VERSION" Manycraft-Setup-* --clobber

  linux:
    needs: [prepare, agent]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - name: Use the prebuilt companion agent
        shell: bash
        run: echo "MANYCRAFT_AGENT_JAR=$RUNNER_TEMP/agent/manycraft-agent.jar" >> "$GITHUB_ENV"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libasound2-dev pkg-config
      - run: cargo build --release --locked
      - name: AppImage
        run: |
          D=AppDir
          mkdir -p $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/512x512/apps
          cp target/release/manycraft $D/usr/bin/
          cp packaging/linux/manycraft.desktop $D/usr/share/applications/
          cp packaging/linux/manycraft.desktop $D/
          cp packaging/icons/manycraft.png $D/usr/share/icons/hicolor/512x512/apps/manycraft.png
          cp packaging/icons/manycraft.png $D/manycraft.png
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/manycraft" "$@"\n' > $D/AppRun
          chmod +x $D/AppRun
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          IMAGE="Manycraft-$VERSION-linux-x86_64.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $D "$IMAGE"
          sha256sum "$IMAGE" > "$IMAGE.sha256"
      - name: Upload
        run: gh release upload "v$VERSION" Manycraft-*.AppImage* --clobber

  sign:
    needs: [prepare, macos, windows, linux]
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'failure' || needs.macos.result == 'cancelled')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign every file of the release
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The repository secret MINISIGN_SECRET_KEY is missing."
            exit 1
          fi
          KEY="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY")
          mkdir files && cd files
          gh release download "v$VERSION"
          rm -f ./*.minisig
          count=0
          for f in *; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            if ! printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY" -m "$f" -t "Manycraft $VERSION $f" > /dev/null; then
              echo "::error::Signing $f failed. Check that MINISIGN_PASSWORD fits the key."
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No release files were downloaded to sign."
            exit 1
          fi
          gh release upload "v$VERSION" ./*.minisig --clobber

  publish:
    needs: [prepare, test, sign, macos]
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.test.result == 'success' &&
      needs.sign.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish as a pre-release, never as the latest release
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          PRE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$PRE" != "true" ]; then
            echo "::error::$TAG is not marked as a pre-release. Stable installs would be offered it."
            exit 1
          fi
          if [ "${{ needs.macos.result }}" != "success" ]; then
            echo "::warning::Publishing $TAG without the macOS build (macos job result: ${{ needs.macos.result }})."
          fi
          gh release edit "$TAG" --draft=false --prerelease --latest=false
