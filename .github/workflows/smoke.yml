name: Smoke

on:
  push:
    branches: [main]
    paths: ['agent/**', 'src/core/smoke.rs', '.github/workflows/smoke.yml']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: List the releases the companion supports
        id: list
        run: |
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          releases = [v["id"] for v in json.load(open("manifest.json"))["versions"] if v["type"] == "release"]
          def key(v):
              m = re.match(r"(\d+)\.(\d+)", v)
              return (int(m[1]), int(m[2])) if m else (0, 0)
          wanted = [v for v in releases if key(v) >= (26, 1)]
          print("versions=" + json.dumps(wanted))
          print("latest=" + releases[0])
          EOF
      - name: Seen this release already
        if: github.event_name == 'schedule'
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: seen
          key: smoke-seen-${{ steps.list.outputs.latest }}
          lookup-only: true
      - name: Decide
        id: decide
        run: echo "run=${{ github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: releases
    if: needs.releases.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Companion agent
        working-directory: agent
        run: ./gradlew agentJar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libasound2-dev pkg-config
      - name: Build
        run: MANYCRAFT_AGENT_JAR="$PWD/agent/build/libs/manycraft-agent.jar" cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: manycraft-linux
          path: target/debug/manycraft
          if-no-files-found: error

  smoke:
    needs: [releases, build]
    name: smoke (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      MANYCRAFT_HOME: ${{ github.workspace }}/home
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manycraft-linux
      - name: Display and GL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libpulse0
      - uses: actions/cache@v4
        with:
          path: |
            home/assets
            home/libraries
            home/versions
            home/runtimes
          key: smoke-game-${{ matrix.version }}
      - name: Hidden game with the companion
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          chmod +x manycraft
          xvfb-run -a -s '-screen 0 1280x720x24' ./manycraft smoke --version '${{ matrix.version }}' --timeout 900
      - name: Game logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.version }}
          path: |
            home/instances/*/games/*/logs/*.log
            home/instances/*/games/*/crash-reports/
          if-no-files-found: warn

  seen:
    needs: [releases, smoke]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir seen && echo '${{ needs.releases.outputs.latest }}' > seen/release
      - uses: actions/cache/save@v4
        with:
          path: seen
          key: smoke-seen-${{ needs.releases.outputs.latest }}
