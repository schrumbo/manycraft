name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  app:
    name: app (${{ matrix.os }})
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: companion
          path: ${{ runner.temp }}/companion
      - name: Use the prebuilt companion mods
        shell: bash
        run: |
          d="$RUNNER_TEMP/companion"
          : > "$d/none.jar"
          pick() { f=$(find "$d" -name "$1" ! -name '*-slim.jar' | head -1); echo "${f:-$d/none.jar}"; }
          echo "MANYCRAFT_COMPANION_JAR=$(find "$d" -name 'manycraft-companion-[0-9]*.jar' | head -1)" >> "$GITHUB_ENV"
          echo "MANYCRAFT_COMPANION_NEOFORGE_JAR=$(pick 'manycraft-companion-neoforge-*.jar')" >> "$GITHUB_ENV"
          echo "MANYCRAFT_COMPANION_FORGE_JAR=$(pick 'manycraft-companion-forge-*.jar')" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libasound2-dev pkg-config
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D clippy::correctness

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the mod changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || [ -n "$(git diff --name-only "$BEFORE" HEAD -- .)" ]; then
            echo "loaders=true" >> "$GITHUB_OUTPUT"
          else
            echo "loaders=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all loaders
        if: steps.changes.outputs.loaders == 'true'
        run: ./gradlew build
      - name: Build the Fabric jar
        if: steps.changes.outputs.loaders != 'true'
        run: ./gradlew :fabric:build -PfabricOnly
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: |
            mod/fabric/build/libs/manycraft-companion-*.jar
            mod/neoforge/build/libs/manycraft-companion-neoforge-*.jar
            mod/forge/build/libs/manycraft-companion-forge-*.jar
            !mod/forge/build/libs/*-slim.jar
          if-no-files-found: error
