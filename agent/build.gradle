import java.security.MessageDigest

plugins {
	id 'java'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-proc:none']
}

repositories {
	maven {
		name = 'Mojang'
		url = 'https://libraries.minecraft.net/'
		metadataSources {
			artifact()
		}
		content {
			includeGroup 'com.mojang'
		}
	}
	mavenCentral()
}

def clientJar = layout.buildDirectory.file("minecraft/client-${minecraft_version}.jar")

static String sha1(File file) {
	MessageDigest digest = MessageDigest.getInstance('SHA-1')
	file.withInputStream { input ->
		byte[] buffer = new byte[65536]
		int n
		while ((n = input.read(buffer)) > 0) {
			digest.update(buffer, 0, n)
		}
	}
	digest.digest().collect { String.format('%02x', it) }.join()
}

def minecraftJar = tasks.register('minecraftJar') {
	def out = clientJar
	def sha = minecraft_client_sha1
	inputs.property 'sha1', sha
	outputs.file out
	doLast {
		File file = out.get().asFile
		if (file.isFile() && sha1(file) == sha) {
			return
		}
		file.parentFile.mkdirs()
		File part = new File(file.path + '.part')
		new URI("https://piston-data.mojang.com/v1/objects/${sha}/client.jar").toURL().withInputStream { input ->
			part.withOutputStream { it << input }
		}
		if (sha1(part) != sha) {
			part.delete()
			throw new GradleException("client jar checksum mismatch")
		}
		file.delete()
		if (!part.renameTo(file)) {
			throw new GradleException("cannot move ${part} to ${file}")
		}
	}
}

sourceSets {
	boot {
		java.srcDir 'src/boot/java'
	}
	payload {
		java.srcDir 'src/payload/java'
		compileClasspath += boot.output
	}
	test {
		compileClasspath += boot.output + payload.output
		runtimeClasspath += boot.output + payload.output
	}
}

configurations {
	minecraft
	payloadCompileOnly.extendsFrom minecraft
	testImplementation.extendsFrom minecraft
}

def lwjgl = '3.4.3'
def netty = '4.2.16.Final'

dependencies {
	minecraft files(clientJar).builtBy(minecraftJar)
	minecraft 'com.google.code.gson:gson:2.14.0'
	minecraft 'org.slf4j:slf4j-api:2.0.17'
	minecraft 'com.google.guava:guava:33.6.0-jre'
	minecraft 'it.unimi.dsi:fastutil:8.5.18'
	minecraft 'org.joml:joml:1.10.9'
	minecraft 'org.jspecify:jspecify:1.0.0'
	minecraft 'org.apache.commons:commons-lang3:3.20.0'
	minecraft 'com.mojang:brigadier:1.3.11'
	minecraft 'com.mojang:datafixerupper:10.0.21'
	minecraft 'com.mojang:authlib:10.0.77'
	minecraft 'com.mojang:logging:1.7.12'
	['lwjgl', 'lwjgl-sdl', 'lwjgl-glfw', 'lwjgl-openal', 'lwjgl-opengl'].each { minecraft "org.lwjgl:${it}:${lwjgl}" }
	['netty-buffer', 'netty-common', 'netty-transport', 'netty-handler', 'netty-codec-base', 'netty-resolver'].each { minecraft "io.netty:${it}:${netty}" }

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	systemProperty 'manycraft.client', clientJar.get().asFile.absolutePath
	dependsOn minecraftJar
}

def payloadVersion = tasks.register('payloadVersion') {
	def out = layout.buildDirectory.file('generated/payload/version.txt')
	def version = project.version.toString()
	inputs.property 'version', version
	outputs.file out
	doLast {
		out.get().asFile.text = version
	}
}

def agentJar = tasks.register('agentJar', Jar) {
	archiveFileName = 'manycraft-agent.jar'
	destinationDirectory = layout.buildDirectory.dir('libs')
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	from sourceSets.boot.output
	from(sourceSets.payload.output.classesDirs) {
		into 'payload'
		rename '(.+)\\.class', '$1.bin'
	}
	dependsOn payloadVersion
	from(layout.buildDirectory.dir('generated/payload')) {
		into 'payload'
	}
	manifest {
		attributes(
			'Premain-Class': 'io.github.schrumbo.manycraft.agent.Agent',
			'Boot-Class-Path': 'manycraft-agent.jar',
			'Implementation-Version': project.version
		)
	}
}

tasks.named('jar') {
	enabled = false
}

tasks.named('assemble') {
	dependsOn agentJar
}

tasks.named('test') {
	dependsOn agentJar
	systemProperty 'manycraft.agentJar', agentJar.get().archiveFile.get().asFile.absolutePath
}
